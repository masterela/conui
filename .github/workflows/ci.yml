# Builds and tests on the three platforms conui claims to support.
#
# The Windows job is the point of this file. `crates/conui-term/src/platform/windows.rs` is written
# against the Console API and there is no Windows toolchain on the development machine, so this job
# is the only thing that compiles it — and a backend nothing compiles is a guess. Nothing in the
# suite needs a terminal: a `Frame` owns nothing but a `Buffer`, so every test renders into memory
# and runs headless on a CI box. That is also the limit of what this proves; entering a console and
# putting it back is the one part no headless job can exercise.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace is free here and saves a round trip when something only fails on one platform.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, rather than the first failure hiding the other two.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Versions
        run: cargo --version --verbose && rustc --version --verbose

      # `--all-targets` so the examples compile too: they are where the widgets are actually used,
      # and a library that builds while its examples do not is not much of a library.
      - name: Build
        run: cargo build --workspace --all-targets

      # Clippy on every platform, not only Linux. The first run of this workflow found dead code in
      # platform/windows.rs that an Ubuntu-only lint job structurally cannot see — and that file is
      # precisely the one with no local compiler to check it, so this is where lints matter most.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Example tests are separate targets and `--workspace` does not reach them. Each example
      # drives its own handlers and asserts on rendered rows. `monitor` also reads the machine it is
      # running on, which is the only thing that can say whether its `ps`, `/proc` and `tasklist`
      # parsing still matches what each platform actually prints.
      - name: Test the examples
        run: |
          cargo test -p conui --example snake
          cargo test -p conui --example todo
          cargo test -p conui --example settings
          cargo test -p conui --example monitor

      # Proof the layout survives the round trip on this platform, not just that the tests pass.
      - name: Compose a frame
        run: |
          cargo run -q -p conui --example snake -- --dump 20
          cargo run -q -p conui --example todo -- --dump 78 15
          cargo run -q -p conui --example settings -- --dump 88 24 --tab 2
          cargo run -q -p conui --example monitor -- --dump 100 24

      # The one thing a CI box is better at than a developer's machine: it has no terminal. Every
      # example must decline rather than fail at `tcgetattr`, and must say so in a sentence — the
      # unit tests can only check the error value, because a test calling `Terminal::enter` on a
      # developer's machine would find a real tty and take it over mid-suite.
      - name: Refuse a redirected stdin
        shell: bash
        run: |
          for example in snake todo settings monitor; do
            path=target/debug/examples/$example
            [ -f "$path.exe" ] && path=$path.exe
            if "$path" < /dev/null > out.txt 2> err.txt; then
              echo "$example: ran to completion with no terminal, which it cannot have done"
              exit 1
            fi
            if ! grep -q 'needs an interactive terminal' err.txt; then
              echo "$example: failed, but not with the message a user can act on:"
              cat err.txt
              exit 1
            fi
            # `Debug`-printed io::Error is the failure this step exists to catch.
            if grep -q 'kind: Unsupported' err.txt; then
              echo "$example: printed the error struct rather than its message:"
              cat err.txt
              exit 1
            fi
            echo "$example: $(cat err.txt)"
          done
          rm -f out.txt err.txt

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Formatting is the one check that cannot differ by platform, so it runs once.
      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  # `missing_docs` in each crate root keeps the docs present; this keeps them honest. A broken
  # intra-doc link is invisible until someone reads the rendered page and finds a dead reference,
  # which is exactly when nobody is in a position to fix it. Rustdoc reads the same source on every
  # platform, so once is enough — unlike clippy, which sees a different `platform` module per host.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable
        run: rustup update stable --no-self-update && rustup default stable

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv · 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest claims `rust-version = "1.85"`, the first release with edition 2024. A claim
      # nothing checks is a claim that drifts the first time a newer API looks convenient.
      - name: Install 1.85
        run: rustup toolchain install 1.85 --profile minimal --no-self-update

      - name: Check
        run: cargo +1.85 check --workspace --all-targets
